[package]
name = "shader-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "24.0.0"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.3"
eyre = "0.6.12"
pollster = "0.4.0"
dotenvy = "0.15.7"
bytemuck = "1.22.0"
winit = "0.30.9"
egui = "0.31.1"
egui_winit_platform = "0.26.0"
epi = "0.17.0"
egui_demo_lib = "0.31.1"
egui_wgpu_backend = "0.34.0"

# Necessary to fix a breaking issue with deranged on Rust 2024
[dependencies.time]
version = "0.3.41"
