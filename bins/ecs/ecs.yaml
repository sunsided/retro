# TODO: Allow definition of custom commands to be emitted by systems

states:
  - name: Render
    description: The render state

components:
  - name: Position
  - name: Velocity
  - name: Health
  - name: Collider

archetypes:
  - name: Particle
    description: A particle system particle.
    components:
      - Position
      - Velocity

  - name: Player
    components:
      - Position
      - Velocity
      - Health

  - name: ForegroundObject
    components:
      - Position
      - Collider

  - name: BackgroundObject
    components:
      - Position

phases:
  - name: Startup
  - name: FixedUpdate
    fixed: 60Hz
  - name: Update
  - name: Render
    manual: true

systems:
  - name: Physics
    phase: FixedUpdate
    context: true
    entities: true
    commands: true
    inputs:
      - Velocity
    outputs:
      - Position
  - name: Render
    phase: Render
    context: true
    states:
      - use: Render
        write: false  # optional
    inputs:
      - Position

worlds:
  - name: Main
    archetypes:
      - Particle
      - Player
      - ForegroundObject
      - BackgroundObject

