# TODO: Allow definition of custom commands to be emitted by systems

allow_unsafe: true

states:
  - name: WgpuRender
    description: The WGPU render state; will be initialized in the Render phase hooks
  - name: ActiveCamera
    description: The uniforms of the active camera.
  - name: Input
    description: The device input obtained from the window system.

phases:
  - name: Startup
  - name: FixedUpdate
    fixed: 60Hz
  - name: Update
  - name: Render
    manual: true
    states:
      - use: WgpuRender
        begin_phase: write
        end_phase: write

worlds:
  - name: Main
    archetypes:
      - Environment
      - Camera
      - Cube
      - Player
      - Tile
      - ForegroundObject
      - BackgroundObject
      - SceneBackground
      - DynamicLight

components:
  - name: TimeOfDay
  - name: Sun
  - name: Skydome
  - name: AmbientLight
  - name: Stars
  - name: Camera
  - name: CameraFpsController
  - name: Position
  - name: Transform
  - name: Velocity
  - name: Tile
  - name: Health
  - name: Collider
  - name: Model
  - name: Color
  - name: BackgroundColor
    description: The background color used for clearing the render buffer
  - name: DynamicLight
    description: A marker component for light entities

archetypes:
  - name: Environment
    components:
      - TimeOfDay
      - Sun
      - Skydome
      - AmbientLight
      - Stars

  - name: Camera
    components:
      - Camera
      - CameraFpsController

  - name: DynamicLight
    components:
      - DynamicLight
      - Color
      - Position

  - name: Tile
    components:
      - Tile
      - Position

  - name: Cube
    description: A marching cube :)
    components:
      - Position
      - Velocity
      - Transform
      - Model

  - name: Player
    components:
      - Position
      - Velocity
      - Health

  - name: ForegroundObject
    components:
      - Position
      - Collider

  - name: BackgroundObject
    components:
      - Position

  - name: SceneBackground
    description: The scene background.
    components:
      - BackgroundColor

systems:
  - name: Camera
    phase: Update
    states:
      - use: Input
      - use: WgpuRender  # for the screen size
    outputs:
      - Camera
      - CameraFpsController

  - name: TimeOfDay
    phase: FixedUpdate
    context: true
    outputs:
      - TimeOfDay

  - name: Sun
    phase: FixedUpdate
    inputs:
      - TimeOfDay
    outputs:
      - Sun
      - Skydome
      - AmbientLight

  - name: Stars
    phase: FixedUpdate
    inputs:
      - TimeOfDay
    outputs:
      - Stars

  - name: Physics
    phase: FixedUpdate
    context: true
    # entities: true
    # commands: true
    inputs:
      - Velocity
    outputs:
      - Position

  - name: BackgroundColorCycle
    phase: Update
    context: true
    outputs:
      - BackgroundColor

  - name: CameraRender
    phase: Render
    states:
      - use: WgpuRender
      - use: ActiveCamera
        default: none
        system: write
    inputs:
      - Camera

  - name: FrameGlobals
    phase: Render
    inputs:
      - TimeOfDay
    outputs:
      - Sun
      - AmbientLight
      - Stars
      - Skydome
    states:
      - use: WgpuRender
        default: write

  - name: RenderBackground
    phase: Render
    inputs:
      - BackgroundColor
    states:
      - use: WgpuRender
        default: write

  - name: RenderSky
    phase: Render
    run_after:
      - RenderBackground
    inputs:
      - Skydome
    states:
      - use: WgpuRender
        default: write

  - name: Render
    phase: Render
    run_after:
      - RenderSky
    inputs:
      - Position
      - Transform
      - Model
    states:
      - use: WgpuRender
        default: write

  - name: TileRender
    phase: Render
    run_after:
      - Render
    inputs:
      - Tile
      - Position
    states:
      - use: WgpuRender
        default: write

  - name: DynamicLight
    context: true
    phase: Render
    run_after:
      - Render
    states:
      - use: WgpuRender
        default: write
    inputs:
      - Color
    outputs:
      - DynamicLight

  - name: VgaBlit
    description: If retro rendering is enabled, this system blits the VGA offscreen buffer to the screen
    phase: Render
    run_after:
      - Render  # specifically, run last
    inputs:
      - BackgroundColor
    states:
      - use: WgpuRender
        default: write

# TODO: List systems and their inputs and mutation targets. Generate traits that implement the signature.
# TODO: Generate a function that loops all archetypes matching the signature of a given system
