# TODO: How to pass in globals such as delta time since last frame, etc? Systems will need those.

components:
  - name: Position
  - name: Velocity
  - name: Health
  - name: Collider

archetypes:
  - name: Particle
    description: A particle system particle.
    components:
      - Position
      - Velocity

  - name: Player
    components:
      - Position
      - Velocity
      - Health

  - name: ForegroundObject
    components:
      - Position
      - Collider
    promotions:
      # TODO: Implement promotions of individual entities, not entire archetypes
      - BackgroundObject

  - name: BackgroundObject
    components:
      - Position
    promotions:
      - ForegroundObject
    # TODO promote from -> to, remove x,y,z, add a,b
    # TODO double check the existence of x,y,z on the source
    # TODO double check the existence of a,b on the destination

phases:
  - name: Startup
  - name: FixedUpdate
  - name: Update
  - name: Render

systems:
  - name: Physics
    phase: FixedUpdate
    # TODO: Allow passing of entity IDs (entities: true?)
    inputs:
      - Velocity
    outputs:
      - Position
  - name: Render
    phase: Render
    inputs:
      - Position

