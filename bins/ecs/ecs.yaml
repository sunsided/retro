# TODO: Allow definition of custom commands to be emitted by systems

allow_unsafe: true

states:
  - name: WgpuRender
    description: The WGPU render state; will be initialized in the Render phase hooks
  - name: ActiveCamera
    description: The uniforms of the active camera.
  - name: Input
    description: The device input obtained from the window system.

phases:
  - name: Startup
  - name: FixedUpdate
    fixed: 60Hz
  - name: Update
  - name: Render
    manual: true
    states:
      - use: WgpuRender
        write: true

worlds:
  - name: Main
    archetypes:
      - Camera
      - Cube
      - Player
      - ForegroundObject
      - BackgroundObject
      - SceneBackground
      - DynamicLight

components:
  - name: Camera
  - name: CameraFpsController
  - name: Position
  - name: Transform
  - name: Velocity
  - name: Health
  - name: Collider
  - name: Model
  - name: Color
  - name: BackgroundColor
    description: The background color used for clearing the render buffer
  - name: DynamicLight
    description: A marker component for light entities

archetypes:
  - name: Camera
    components:
      - Camera
      - CameraFpsController

  - name: DynamicLight
    components:
      - DynamicLight
      - Color
      - Position

  - name: Cube
    description: A marching cube :)
    components:
      - Position
      - Velocity
      - Transform
      - Model

  - name: Player
    components:
      - Position
      - Velocity
      - Health

  - name: ForegroundObject
    components:
      - Position
      - Collider

  - name: BackgroundObject
    components:
      - Position

  - name: SceneBackground
    description: The scene background.
    components:
      - BackgroundColor

systems:
  - name: Camera
    phase: Update
    states:
      - use: Input
      - use: WgpuRender  # for the screen size
    outputs:
      - Camera
      - CameraFpsController

  - name: CameraRender
    phase: Render
    states:
      - use: WgpuRender
      - use: ActiveCamera
        write: true
    inputs:
      - Camera

  - name: Physics
    phase: FixedUpdate
    context: true
    # entities: true
    # commands: true
    inputs:
      - Velocity
    outputs:
      - Position

  - name: BackgroundColorCycle
    phase: Update
    context: true
    outputs:
      - BackgroundColor

  - name: RenderBackground
    phase: Render
    inputs:
      - BackgroundColor
    states:
      - use: WgpuRender
        write: true

  - name: Render
    phase: Render
    run_after:
      - RenderBackground
    inputs:
      - Position
      - Transform
      - Model
    states:
      - use: WgpuRender
        write: true

  - name: DynamicLight
    context: true
    phase: Render
    run_after:
      - Render
    states:
      - use: WgpuRender
        write: true
    inputs:
      - Color
    outputs:
      - DynamicLight

  - name: VgaBlit
    description: If retro rendering is enabled, this system blits the VGA offscreen buffer to the screen
    phase: Render
    run_after:
      - Render  # specifically, run last
    inputs:
      - BackgroundColor
    states:
      - use: WgpuRender
        write: true

