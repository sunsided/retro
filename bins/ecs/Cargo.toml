[package]
name = "ecs"
version = "0.1.0"
edition = "2021"

[features]
default = ["jpeg", "png", "webp", "no-tracing"]
jpeg = ["image/jpeg"]
png = ["image/png"]
webp = ["image/webp"]
no-tracing = ["tracing/max_level_debug"]

[dependencies]
bytemuck = "1.22.0"
crossbeam-channel = "0.5.14"
dotenvy = "0.15.7"
eyre = "0.6.12"
parking_lot = { version = "0.12.3", features = ["arc_lock"] }
pollster = "0.4.0"
rayon = "1.10.0"
thiserror = "2.0.12"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.3"
winit = "0.30.9"
wgpu = "24.0.3"
image = { version = "0.25.6", default-features = false }
derive_more = { version = "2.0.1", features = ["as_ref", "deref", "deref_mut"] }
cgmath = "0.18.0"
tobj = "4.0.3"
clap = { version = "4.5.35", features = ["env"] }
fxhash = "0.2.1"

# Necessary to fix a breaking issue with deranged on Rust 2024
[dependencies.time]
version = "0.3.41"

[build-dependencies]
# sillyecs = { git = "https://github.com/sunsided/sillyecs.git", branch = "main" }
sillyecs.path = "../../../sillyecs"
eyre = "0.6.12"
fs_extra = "1.3.0"
naga = { version = "25.0.0", features = ["wgsl-in"] }
