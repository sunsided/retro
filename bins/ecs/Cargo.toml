[package]
name = "ecs"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.22.0"
crossbeam-channel = "0.5.14"
dotenvy = "0.15.7"
eyre = "0.6.12"
multibuffer = { path = "../../crates/multibuffer" }
parking_lot = { version = "0.12.3", features = ["arc_lock"] }
pollster = "0.4.0"
rayon = "1.10.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.3"
winit = "0.30.9"
wgpu = "24.0.3"

[build-dependencies]
# sillyecs = { git = "https://github.com/sunsided/sillyecs.git", branch = "main" }
sillyecs.path = "../../../sillyecs"
eyre = "0.6.12"
