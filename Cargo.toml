[package]
name = "retro"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "retro"
path = "src/main.rs"

[lib]
name = "retro"
path = "src/lib.rs"

[dependencies]
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
dotenvy = "0.15.7"
minifb = "0.28.0"
rand = "0.9.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.3"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "plasma"
harness = false

[[bench]]
name = "fire"
harness = false

[[bench]]
name = "crt"
harness = false

[profile.dev]
opt-level = 1
debug = true