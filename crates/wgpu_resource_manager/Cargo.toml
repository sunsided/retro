[package]
name = "wgpu_resource_manager"
version = "0.1.0"
edition = "2024"

[features]
default = ["tracing_attributes", "image"]
image = ["dep:image"]
tracing_attributes = ["tracing/attributes"]
winit = ["dep:winit"]

[dependencies]
fxhash = "0.2.1"
image = { version = "0.25.6", optional = true }
thiserror = "2.0.12"
tracing = { version = "0.1.41", features = ["release_max_level_debug"] }
wgpu = { version = "25.0.0" }
winit = { version = "0.30.9", optional = true, default-features = false }
bytemuck = "1.22.0"

[dev-dependencies]
pollster = "0.4.0"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
