[package]
name = "retro"
version = "0.1.0"
edition = "2024"

[lib]
name = "retro"
path = "src/lib.rs"

[dependencies]
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
fastrand = "2.3.0"
minifb = "0.28.0"
rand = "0.9.0"
rayon = "1.10.0"
spin_sleep = "1.3.1"
tracing = "0.1.41"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "plasma"
harness = false

[[bench]]
name = "fire"
harness = false

[[bench]]
name = "crt"
harness = false
