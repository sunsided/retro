[package]
name = "retro"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "retro"
path = "src/main.rs"

[lib]
name = "retro"
path = "src/lib.rs"

[dependencies]
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
dotenvy = "0.15.7"
fastrand = "2.3.0"
minifb = "0.28.0"
rand = "0.9.0"
rayon = "1.10.0"
spin_sleep = "1.3.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.3"

[dependencies.deranged]
version = "=0.4.0" # fix build issue with tracing-appender > time > deranged

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "plasma"
harness = false

[[bench]]
name = "fire"
harness = false

[[bench]]
name = "crt"
harness = false
